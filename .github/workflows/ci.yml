name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: THE HARD GATE
        run: npx vitest run packages/engine/test/gate.test.ts

      - name: Run full test suite
        run: npx vitest run

      - name: energy-balance-gate
        run: node scripts/ci-energy-balance.mjs
